<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galerie Photo</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f5f0e8;
      --ink: #1a1209;
      --amber: #c8841a;
      --amber-light: #e8a83a;
      --shadow: rgba(26,18,9,0.12);
      --border: rgba(26,18,9,0.15);
    }

    body {
      background-color: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Grain texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* Decorative top band */
    .top-band {
      height: 4px;
      background: linear-gradient(90deg, var(--ink) 0%, var(--amber) 50%, var(--ink) 100%);
    }

    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2rem 2rem;
      border-bottom: 1px solid var(--border);
    }

    header .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--amber);
      font-weight: 500;
      margin-bottom: 0.75rem;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    header h1 em {
      font-style: italic;
      color: var(--amber);
    }

    header p {
      margin-top: 0.8rem;
      font-size: 0.95rem;
      color: rgba(26,18,9,0.55);
      font-weight: 300;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    /* Upload Zone */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 2px;
      padding: 3.5rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255,255,255,0.4);
      position: relative;
      overflow: hidden;
    }

    .upload-zone::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(200,132,26,0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--amber);
      background: rgba(255,255,255,0.7);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px var(--shadow);
    }

    .upload-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 1.2rem;
      position: relative;
    }

    .upload-icon svg {
      width: 100%;
      height: 100%;
      stroke: var(--amber);
    }

    .upload-zone h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .upload-zone p {
      font-size: 0.85rem;
      color: rgba(26,18,9,0.5);
      font-weight: 300;
      margin-bottom: 1.5rem;
    }

    .btn-upload {
      display: inline-block;
      background: var(--ink);
      color: var(--cream);
      padding: 0.65rem 2rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-upload:hover {
      background: var(--amber);
      transform: translateY(-1px);
    }

    #fileInput { display: none; }

    /* Divider 
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 3rem 0 2rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.95rem;
      color: rgba(26,18,9,0.4);
      white-space: nowrap;
    }*/

    /* Preview Section */
    #previewSection { display: none; }

    .preview-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .preview-header h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 400;
    }

    .btn-clear {
      font-size: 0.75rem;
      color: rgba(26,18,9,0.45);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .btn-clear:hover { color: #c0392b; }

    /* Photo Grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
    }

    .photo-card {
      position: relative;
      background: white;
      box-shadow: 0 4px 20px var(--shadow);
      overflow: hidden;
      animation: fadeUp 0.4s ease forwards;
      opacity: 0;
      transform: translateY(12px);
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .photo-card:hover img {
      transform: scale(1.04);
    }

    .photo-card .photo-info {
      padding: 0.6rem 0.8rem;
      border-top: 1px solid var(--border);
    }

    .photo-card .photo-name {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: rgba(26,18,9,0.7);
    }

    .photo-card .photo-size {
      font-size: 0.65rem;
      color: rgba(26,18,9,0.35);
      margin-top: 0.1rem;
    }

    .photo-card .btn-remove {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      width: 26px;
      height: 26px;
      background: rgba(26,18,9,0.75);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s;
      border-radius: 50%;
    }

    .photo-card:hover .btn-remove { opacity: 1; }
    .photo-card .btn-remove:hover { background: #c0392b; }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26,18,9,0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: zoom-out;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      animation: zoomIn 0.25s ease;
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }

    .lightbox-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      color: rgba(245,240,232,0.7);
      font-size: 1.5rem;
      cursor: pointer;
      background: none;
      border: none;
      transition: color 0.2s;
    }

    .lightbox-close:hover { color: var(--amber); }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      color: rgba(26,18,9,0.3);
      border-top: 1px solid var(--border);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="top-band"></div>

  <header>
    <p class="eyebrow">Mathys KARIM GRISONI - Angèle SIMONNET - Clément GASCHET</p>
    <h1> Reconnaissance <em>OCR</em> </h1>
    <p>Transformer vos notes manuscrites en PDF</p>
  </header>

  <main>
    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
          <polyline points="12 5 12 9 14 7"/>
          <polyline points="12 5 10 7"/>
        </svg>
      </div>
      <h2>Déposez vos photos ici</h2>
      <p>PNG UNIQUEMENT - jusqu'à 20 Mo par fichier</p>
      <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
        Choisir des fichiers
      </button>
      <input type="file" id="fileInput" multiple accept="image/*" />
    </div>

    <div id="previewSection">
      <div class="divider"><span>Vos photos</span></div>
      <div class="preview-header">
        <h3 id="photoCount"></h3>
        <button class="btn-clear" onclick="clearAll()">Tout effacer</button>
      </div>
      <div class="photo-grid" id="photoGrid"></div>
    </div>
  </main>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img id="lightboxImg" src="" alt=""/>
  </div>

 

  <script>
    const zone = document.getElementById('uploadZone');
    const input = document.getElementById('fileInput');
    const grid = document.getElementById('photoGrid');
    const section = document.getElementById('previewSection');
    const countEl = document.getElementById('photoCount');
    let photos = [];

    // Drag & Drop
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      handleFiles(Array.from(e.dataTransfer.files));
    });

    input.addEventListener('change', () => handleFiles(Array.from(input.files)));

    function handleFiles(files) {
      files.filter(f => f.type.startsWith('image/')).forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
          photos.push({ src: e.target.result, name: file.name, size: file.size });
          renderGrid();
        };
        reader.readAsDataURL(file);
      });
    }

    function renderGrid() {
      grid.innerHTML = '';
      section.style.display = photos.length ? 'block' : 'none';
      countEl.textContent = `${photos.length} photo${photos.length > 1 ? 's' : ''}`;
      photos.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.style.animationDelay = `${i * 0.06}s`;
        card.innerHTML = `
          <img src="${p.src}" alt="${p.name}" onclick="openLightbox('${p.src}')" style="cursor:zoom-in"/>
          <div class="photo-info">
            <div class="photo-name">${p.name}</div>
            <div class="photo-size">${formatSize(p.size)}</div>
          </div>
          <button class="btn-remove" onclick="removePhoto(${i})" title="Supprimer">✕</button>
        `;
        grid.appendChild(card);
      });
    }

    function removePhoto(i) {
      photos.splice(i, 1);
      renderGrid();
    }

    function clearAll() {
      photos = [];
      renderGrid();
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' o';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' Ko';
      return (bytes / 1048576).toFixed(1) + ' Mo';
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  </script>
</body>
</html>
